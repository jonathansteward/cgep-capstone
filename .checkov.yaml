# Checkov config (Tier 0 static analysis for this capstone).
# Run: checkov -d terraform --config-file .checkov.yaml
# CI: .github/workflows/grc-gate.yml, "checkov (Tier 0 IaC scan)" step.
#
# Inline `#checkov:skip=` comments don't suppress the checks below (tested
# against checkov 3.3.10 and 3.3.19, the version CI's checkov-action pins)
# — they're graph-based checks that don't attach to a single HCL line — so
# the skips are declared here instead, each with the same rationale that
# would otherwise be an inline comment.
skip-check:
  # kms.tf: data.aws_iam_policy_document.evidence_key — a KMS key policy's
  # Resource is always "*" (the policy is scoped to the key it's attached
  # to; there is no narrower ARN to restrict to). The AccountAdmin
  # statement is the standard AWS root-account grant every CMK needs so IAM
  # can govern it. Least privilege here comes from Principal, not Resource.
  - CKV_AWS_111
  - CKV_AWS_356
  - CKV_AWS_109
  # main.tf: aws_apigatewayv2_route.intake — the intake API is
  # intentionally unauthenticated. WORKLOAD.md declares API-layer auth
  # "out of scope for this capstone (a capstone extension, not a
  # requirement)".
  - CKV_AWS_309
  # main.tf: data.aws_availability_zones.available — this is a data
  # source, so no inline #checkov:skip= comment attaches to it. The
  # starter's own dynamic AZ selection (state = "available", indexed by
  # count) predates this capstone's changes and is what keeps the stack
  # region-portable; pinning zone_ids/zone_names would hardcode it to
  # specific AZs in one account/region.
  - CKV_AWS_394
  # aws_s3_bucket.{uploads,vault,trail,access_logs} — cross-region
  # replication. Inline #checkov:skip= doesn't suppress this (graph-based,
  # same limitation as the checks above). WORKLOAD.md declares
  # "Multi-region failover" out of scope for this capstone; replication
  # would also need a destination bucket + IAM role in a second region.
  - CKV_AWS_144
  # aws_s3_bucket.access_logs — event notifications. This is the S3
  # access-log *destination*; it receives a PutObject for every log
  # delivery to the three source buckets, so wiring it to the same
  # compliance_alerts SNS topic (per CKV2_AWS_62) would flood that topic
  # with routine log-delivery noise instead of signal. The three source
  # buckets (uploads, vault, trail) DO have real notifications configured
  # (terraform/monitoring.tf) and pass this check individually.
  - CKV2_AWS_62
  # aws_s3_bucket.access_logs — SSE-KMS. Also graph-based (inline skip
  # tested and doesn't suppress it). S3 server access log delivery only
  # supports SSE-S3 on the destination bucket, not a customer CMK — see
  # terraform/logging.tf.
  - CKV_AWS_145
